<div class="thumbnail" [class.limit-width]="limitWidth" [class.thumbnail--large]="isLargeLandscape()" [class.thumbnail--small]="isSmall()">
  <!-- Fond flou décoratif (vue Mosaïque) -->
  @if (isLoading() === false) {
    <span class="thumbnail-backdrop" aria-hidden="true"
          [style.background-image]="'url(' + (src() ?? collspecDefaultImage) + ')'"></span>
  }
  @if (isLoading()) {
    <div class="thumbnail-content outer">
      <div class="inner">
        <div class="centered">
          <ds-loading [spinner]="true"></ds-loading>
        </div>
      </div>
    </div>
  }
  <!-- don't use *ngIf="!isLoading" so the thumbnail can load in while the animation is playing -->
  @if (src() !== null) {
    <img class="thumbnail-content img-fluid"
         [class.d-none]="isLoading()"
         [src]="src() | dsSafeUrl"
         [alt]="alt | translate"
         (error)="errorHandler()"
         (load)="onImageLoad($any($event.target))"/>
  }
  @if (src() === null && isLoading() === false) {
    <img class="thumbnail-content img-fluid"
      [src]="collspecDefaultImage"
      [alt]="placeholder | translate"
      (load)="onImageLoad($any($event.target))"/>
  }
</div>
