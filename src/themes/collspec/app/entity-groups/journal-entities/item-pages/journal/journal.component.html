@if (showBackButton$ | async) {
  <ds-results-back-button [back]="back"></ds-results-back-button>
}

<div class="d-flex flex-row align-items-start">
  <ds-item-page-title-field
    [item]="object"
    class="me-auto">
  </ds-item-page-title-field>

  <ds-dso-edit-menu></ds-dso-edit-menu>
</div>

<div class="row">
  <!-- Left column: Journal identity and publication information -->
  <div class="col-12 col-md-4">
    <ds-metadata-field-wrapper [hideIfNoTextContent]="false">
      <ds-thumbnail [thumbnail]="object?.thumbnail | async"></ds-thumbnail>
    </ds-metadata-field-wrapper>

    <ds-related-items
      [parentItem]="object"
      [relationType]="'isContinuedBy'"
      [label]="'journal.page.continued-by' | translate">
    </ds-related-items>
	
	<ds-related-items
	  [parentItem]="object"
	  [relationType]="'continues'"
	  [label]="'journal.page.continues' | translate">
	</ds-related-items>
	
	<ds-generic-item-page-field
      class="item-page-fields"
      [item]="object"
      [fields]="['creativeworkseries.issn']"
      [label]="'journal.page.issn'">
    </ds-generic-item-page-field>

    <ds-generic-item-page-field
      class="item-page-fields"
      [item]="object"
      [fields]="['creativeworkseries.eissn', 'dc.identifier.issn']"
      [label]="'journal.page.eissn'">
    </ds-generic-item-page-field>

    <ds-generic-item-page-field
      class="item-page-fields"
      [item]="object"
      [fields]="['creativework.publisher']"
      [label]="'journal.page.publisher'">
    </ds-generic-item-page-field>

    <ds-generic-item-page-field
      class="item-page-fields"
      [item]="object"
      [fields]="['creativework.editor']"
      [label]="'journal.page.editor'">
    </ds-generic-item-page-field>

    <ds-generic-item-page-field
      class="item-page-fields"
      [item]="object"
      [fields]="['dc.language.iso', 'dc.language']"
      [label]="'item.page.language'">
    </ds-generic-item-page-field>

    <ds-generic-item-page-field
      class="item-page-fields"
      [item]="object"
      [fields]="['dc.identifier.uri']"
      [label]="'journal.page.uri'">
    </ds-generic-item-page-field>

    <ds-generic-item-page-field
      class="item-page-fields"
      [item]="object"
      [fields]="['dc.identifier.doi']"
      [label]="'item.page.doi'">
    </ds-generic-item-page-field>

    <ds-generic-item-page-field
      class="item-page-fields"
      [item]="object"
      [fields]="['dc.subject']"
      [label]="'item.page.subject'">
    </ds-generic-item-page-field>

    <ds-generic-item-page-field
      class="item-page-fields"
      [item]="object"
      [fields]="['dc.date.issued']"
      [label]="'journal.page.date'">
    </ds-generic-item-page-field>
  </div>

  <!-- Right column: Volumes and Journal description -->
  <div class="col-12 col-md-8">
    
	<ds-generic-item-page-field
      class="item-page-fields" id="journaldescription"
      [item]="object"
      [fields]="['dc.description']"
      [label]="'journal.page.description'">
    </ds-generic-item-page-field>
	
	<ds-related-items
      [parentItem]="object"
      [relationType]="'isVolumeOfJournal'"
      [label]="'item.page.journal-volumes' | translate">
    </ds-related-items>
	
	<ds-related-items
	  [parentItem]="object"
	  [relationType]="'isIssueOfJournal'"
	  [label]="'item.page.journal-issues' | translate">
	</ds-related-items>
	
    <div class="mt-3">
      <a
        class="btn btn-outline-primary"
        [routerLink]="[itemPageRoute + '/full']"
        role="button"
        tabindex="0">
        {{"item.page.link.full" | translate}}
      </a>
    </div>
  </div>

  <!-- Related publication entities 
  <div class="mt-5 w-100 px-0">
    <ds-tabbed-related-entities-search
      [item]="object"
      [relationTypes]="[{
        label: 'isJournalOfPublication',
        filter: 'isJournalOfPublication',
        configuration: 'default-relationships'
      }]">
    </ds-tabbed-related-entities-search>
  </div>-->
</div>
