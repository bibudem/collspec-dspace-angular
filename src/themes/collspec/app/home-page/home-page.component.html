<!-- Section home-page avec image de fond -->
<div class="hero-section">
  <div class="hero-overlay">
    <h1 [innerHTML]="'collspec.accueil.titre' | translate"></h1>
    <!-- Barre de recherche avec filtres -->
    <div class="search-bar">
      <ds-search-form [inPlaceSearch]="false"
                      [searchPlaceholder]="'home.search-form.placeholder' | translate">
      </ds-search-form>

      <!-- Avis sur les contenus sensibles (sans bibliothèque) :
           aperçu au survol à la souris (CSS) ; ouverture au clic, fermeture par ×, Échap ou clic en dehors -->
      <div class="collspec-avis">
        <span class="collspec-avis__ancre" #avisAncre [class.is-open]="avisOuvert"
              [class.is-masque]="avisMasque" (mouseleave)="avisMasque = false">
          <button type="button" class="collspec-avis__lien" #avisLien
                  aria-controls="collspec-avis-bulle"
                  [attr.aria-expanded]="avisOuvert"
                  (click)="avisOuvert = !avisOuvert">
            <i class="fas fa-circle-info" aria-hidden="true"></i>
            <span>{{ 'collspec.accueil.avis.lien' | translate }}</span>
          </button>
          <span class="collspec-avis__bulle" id="collspec-avis-bulle">
            <span class="collspec-avis__contenu">
              <span class="collspec-avis__entete">
                <span class="collspec-avis__titre">
                  <i class="fas fa-circle-info" aria-hidden="true"></i>
                  {{ 'collspec.accueil.avis.lien' | translate }}
                </span>
                <button type="button" class="collspec-avis__fermer"
                        [attr.aria-label]="'collspec.accueil.avis.fermer' | translate"
                        [attr.title]="'collspec.accueil.avis.fermer' | translate"
                        (click)="fermerAvis(avisLien)">
                  <i class="fas fa-xmark" aria-hidden="true"></i>
                </button>
              </span>
              <span class="collspec-avis__texte">{{ 'collspec.accueil.avis.texte' | translate }}</span>
            </span>
          </span>
        </span>
      </div>
    </div>
  </div>
</div>

<ds-home-coar></ds-home-coar>
<ds-vedette-liste></ds-vedette-liste>
<ds-home-news></ds-home-news>

<div [ngClass]="appConfig.homePage.showDiscoverFilters ? 'container-fluid' : 'collspec-inset'">
  <div class="row">
    <div class="col-sm-3" *ngIf="appConfig.homePage.showDiscoverFilters">
      @if (showDiscoverFilters) {
        <ds-configuration-search-page
          [sideBarWidth]="3"
          [showViewModes]="false"
          [searchEnabled]="false"
          [inPlaceSearch]="false"
          [showScopeSelector]="false">
          <ng-container searchContentTop *ngTemplateOutlet="homeContent"></ng-container>
        </ds-configuration-search-page>
        }
        @if (!showDiscoverFilters) {
        <div class="container">
          <ng-container *ngTemplateOutlet="homeContent"></ng-container>
        </div>
      }
    </div>
    <div [ngClass]="appConfig.homePage.showDiscoverFilters ? 'col-sm-9' : 'col-sm-12'">
      <ds-top-level-community-list></ds-top-level-community-list>
    </div>
  </div>
</div>
<ds-suggestions-popup></ds-suggestions-popup>

<ng-template #homeContent>
    @if (recentSubmissionspageSize>0) {
      <ds-recent-item-list></ds-recent-item-list>
    }
</ng-template>
