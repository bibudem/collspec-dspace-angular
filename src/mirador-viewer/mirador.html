<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mirador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Lora:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <style>
    /* -------------------------------------------------------
      Réordonne les boutons de la barre de titre
      (supporte français et anglais)
    ------------------------------------------------------- */

    /* 1. Full screen / Plein écran */
    .mirador-window-top-bar button[aria-label="Full screen"],
    .mirador-window-top-bar button[aria-label="Plein écran"] { order: 1 !important; }

    /* 2. Window views & thumbnail display / Autres options et outils */
    .mirador-window-top-bar button[aria-label="Window views & thumbnail display"],
    .mirador-window-top-bar button[aria-label="Options de fenêtre"] { order: 2 !important; }

    /* 3. Crop */
    .mirador-window-top-bar button[aria-label="Activate selection of an image region"],
    .mirador-window-top-bar button[aria-label="Activer la sélection d'une zone de l'image"] { order: 3 !important; }

    /* 4. Window options / Options de fenêtre */
    .mirador-window-top-bar button[aria-label="Window options"],
    .mirador-window-top-bar button[aria-label="Autres options et outils"] { order: 4 !important; }

    /* 5. Fermer */
    .mirador-window-top-bar button[aria-label="Fermer cette fenêtre"],
    .mirador-window-top-bar button[aria-label="Close window"] { order: 5 !important; }

    /* -------------------------------------------------------
       Fond du workspace
    ------------------------------------------------------- */
    .mirador1 {
      background: #ffffff !important;
    }

    /* -------------------------------------------------------
      Titre de la fenêtre — responsive
    ------------------------------------------------------- */
    .mirador-window-top-bar {
      display: flex !important;
      flex-wrap: nowrap !important;
      align-items: center !important;
      height: auto !important;
      min-height: 34px !important;
      gap: 0 !important;
      padding:3px;
    }

    /* Les boutons ne rétrécissent pas */
    .mirador-window-top-bar .MuiIconButton-root {
      flex-shrink: 0 !important;
    }

    .mirador-window-top-bar .MuiTypography-h2,
      .mirador-window header nav h2.MuiTypography-noWrap {
        font-family: 'Figtree', Georgia, serif !important;
        font-weight: 600 !important;
        color: #0b113a !important;
        font-size: 1.25rem !important;
        line-height: 1.25 !important;
        white-space: normal;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
        min-width: 0 !important;
        flex: 1 1 0 !important;
      }
      
      /* -------------------------------------------------------
        Boutons flottants OSD — empiler verticalement
        (remplace l'ancienne règle "Expand text overlay")
      ------------------------------------------------------- */

      /* Conteneur commun — position de référence */
      .mirador-osd-container:has(button[aria-label="Expand image tools"]) {
        position: relative !important;
      }

      /* Wrapper du bouton "Expand image tools" */
      .mirador-osd-container .MuiPaper-elevation4:has(button[aria-label="Expand image tools"]) {
        position: absolute !important;
        top: 8px !important;
        right: 8px !important;
        z-index: 10 !important;
      }

      /* Wrapper du bouton "Show/Hide OCR" */
      .mirador-osd-container .MuiPaper-elevation4:has(button[aria-label="Show/Hide OCR"]) {
        position: absolute !important;
        top: 125px !important;
        right: 8px !important;
        z-index: 10 !important;
      }

      /* Wrapper du bouton "Expand text overlay options" */
      .mirador-osd-container .MuiPaper-elevation4:has(button[aria-label="Expand text overlay options"]) {
        position: absolute !important;
        top: 66px !important;
        right: 8px !important;
        z-index: 10 !important;
      }

      @media (max-width: 768px) {
        .mirador-window-top-bar .MuiTypography-h2, .mirador-window header nav h2.MuiTypography-noWrap {
          font-size: 1.15rem !important;
          white-space: nowrap !important;
        }

        button[aria-label*="text overlay"],
        button[aria-label*="OCR"] {
          display: none !important;
        }
      }

      /* -------------------------------------------------------
        Barre de navigation workspace — correction mobile
      ------------------------------------------------------- */

      /* Sur mobile : barre en haut, hauteur fixe, icônes centrées */
      @media (max-width: 599px) {

        /* Réduit la hauteur de la barre en haut */
        .mirador-workspace-control-panel.mirador5 {
          height: 52px !important;
          min-height: 52px !important;
        }

        /* Réduit les boutons dans la barre */
        .mirador-workspace-control-panel .MuiIconButton-root {
          padding: 6px !important;
        }

        .mirador-workspace-control-panel .MuiFab-sizeMedium,
        .mirador-workspace-control-panel .MuiFab-root {
          width: 36px !important;
          height: 36px !important;
          min-height: 36px !important;
        }

        /* Compense le padding-top du workspace (était 74px) */
        .mirador21 {
          padding-top: 52px !important;
        }

        /* Icônes plus petites dans la barre */
        .mirador-workspace-control-panel .MuiSvgIcon-root {
          font-size: 1.2rem !important;
        }

        /* Badge du compteur de fenêtres */
        .mirador-workspace-control-panel .MuiBadge-badge {
          font-size: 0.6rem !important;
          height: 16px !important;
          min-width: 16px !important;
          padding: 0 4px !important;
        }
      }
    /* -------------------------------------------------------
      Panneau Search — correction layout
    ------------------------------------------------------- */

    /* L'en-tête passe en wrap pour que le formulaire
      tombe sur la 2e ligne naturellement */
    .mirador-companion-window-header {
      flex-wrap: wrap !important;
      align-items: center !important;
      padding: 4px 8px !important;
      min-height: auto !important;
      row-gap: 4px !important;
    }

    /* Titre "SEARCH" occupe toute la largeur de la 1re ligne */
    .mirador-companion-window-header .MuiTypography-h3 {
      flex: 0 0 auto !important;
      order: 1 !important;
    }

    /* Bouton "open in panel" reste à droite du titre */
    .mirador-companion-window-header > .MuiIconButton-root {
      flex: 0 0 auto !important;
      order: 2 !important;
      margin-left: auto !important;
    }

    /* Le bloc titre-controls (qui contient le formulaire)
      prend toute la largeur sur la 2e ligne */
    .mirador-companion-window-header .mirador-companion-window-title-controls {
      flex: 1 1 100% !important;
      width: 100% !important;
      min-width: 0 !important;
      order: 3 !important;
      padding: 0 !important;
      margin: 0 0 4px 0 !important;
      min-height: auto !important;
    }

    /* Formulaire et input pleine largeur */
    .mirador-companion-window-header form {
      width: 100% !important;
    }

    .mirador-companion-window-header .MuiFormControl-root,
    .mirador-companion-window-header .MuiAutocomplete-root {
      width: 100% !important;
    }

    /* Empêche l'input de déborder */
    .mirador-companion-window-header .MuiInputBase-root {
      width: 100% !important;
      box-sizing: border-box !important;
    }

    /* -------------------------------------------------------
       Cacher la description du niveau manifest dans Mirador
    ------------------------------------------------------- */
    p.MuiTypography-root.MuiTypography-body1 span.mirador-third-party-html {
      display: none !important;
    }

    /* -------------------------------------------------------
       Panneau latéral — fond et bordure
    ------------------------------------------------------- */
    .mirador-companion-window-left {
      background-color: #ffffff !important;
      border-right: 1px solid #E7EBEE !important;
    }

    /* -------------------------------------------------------
       En-tête "About this item"
    ------------------------------------------------------- */
    .mirador-companion-window-header .MuiTypography-h3 {
      font-family: 'Figtree', -apple-system, sans-serif !important;
      font-size: 0.875rem !important;
      font-weight: 600 !important;
      letter-spacing: 0.10em !important;
      text-transform: uppercase !important;
      color: #607386 !important;
    }

    /* -------------------------------------------------------
       Titres de section : "Current item", "Resource", "Related"
    ------------------------------------------------------- */
    .mirador-window-sidebar-info-panel .MuiTypography-overline {
      font-family: 'Figtree', -apple-system, sans-serif !important;
      font-size: 0.625rem !important;
      font-weight: 600 !important;
      letter-spacing: 0.12em !important;
      text-transform: uppercase !important;
      color: #607386 !important;
    }

    /* -------------------------------------------------------
       Titre item courant et titre ressource
    ------------------------------------------------------- */
    .mirador-window-sidebar-info-panel .MuiTypography-h4 {
      font-family: 'Figtree', -apple-system, sans-serif !important;
      font-size: 1.125rem !important;
      font-weight: 600 !important;
      color: #0b113a !important;
      line-height: 1.25 !important;
    }

    /* -------------------------------------------------------
       Labels clés (dt)
    ------------------------------------------------------- */
    .mirador-window-sidebar-info-panel .mirador-label-value-metadata dt {
      font-family: 'Figtree', -apple-system, sans-serif !important;
      font-size: 0.85rem !important;
      font-weight: 600 !important;
      color: #607386 !important;
      letter-spacing: 0.06em !important;
      padding-top: 0.375rem !important;
      margin-top: 0.25rem !important;
      border-top: 0.5px solid #E7EBEE !important;
    }

    /* -------------------------------------------------------
       Valeurs (dd)
    ------------------------------------------------------- */
    .mirador-window-sidebar-info-panel .mirador-label-value-metadata dd {
      font-family: 'Figtree', -apple-system, sans-serif !important;
      font-size: 0.8125rem !important;
      font-weight: 500 !important;
      color: #252525 !important;
      line-height: 1.5 !important;
      margin-bottom: 0.25em !important;
      margin-left: 0 !important;
    }

    /* -------------------------------------------------------
       Liens dans les métadonnées
    ------------------------------------------------------- */
    .mirador-window-sidebar-info-panel .mirador-label-value-metadata a {
      font-family: 'Figtree', -apple-system, sans-serif !important;
      font-size: 0.8125rem !important;
      font-weight: 500 !important;
      color: #2380D1 !important;
      word-break: break-all !important;
      text-decoration: none !important;
    }

    .mirador-window-sidebar-info-panel .mirador-label-value-metadata a:hover {
      color: #0b113a !important;
      text-decoration: underline !important;
    }

    /* -------------------------------------------------------
       Compteur de pages et label canvas
    ------------------------------------------------------- */
    .mirador-canvas-count,
    .mirador-canvas-label {
      font-family: 'Figtree', -apple-system, sans-serif !important;
      font-size: 0.8125rem !important;
      font-weight: 500 !important;
      color: #607386 !important;
    }

    /* -------------------------------------------------------
       Onglets latéraux — indicateur actif
    ------------------------------------------------------- */
    .MuiTabs-indicator {
      background-color: #2380D1 !important;
    }

    .MuiTab-root.Mui-selected {
      color: #2380D1 !important;
      border-right-color: #2380D1 !important;
    }

    .MuiTab-root.Mui-selected .MuiSvgIcon-root {
      color: #2380D1 !important;
    }

    .MuiTab-root:not(.Mui-selected) .MuiSvgIcon-root {
      color: #607386 !important;
    }

    /* -------------------------------------------------------
       Panneau de navigation workspace (barre gauche)
    ------------------------------------------------------- */
    .mirador-workspace-control-panel {
      background-color: #37424D !important;
    }

    .mirador-workspace-control-panel .MuiIconButton-root .MuiSvgIcon-root {
      color: #ffffff !important;
    }

    .mirador-workspace-control-panel .MuiIconButton-root:hover {
      background-color: rgba(255, 255, 255, 0.15) !important;
    }

    .mirador-workspace-control-panel .MuiIconButton-root:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 2px;
    }

    /* Bouton « + » : blanc sur fond gris */
    .mirador-workspace-control-panel .MuiFab-primary {
      background-color: #ffffff !important;
      color: #37424D !important;
    }

    .mirador-workspace-control-panel .MuiFab-primary .MuiSvgIcon-root {
      color: #37424D !important;
    }

    .mirador-workspace-control-panel .MuiFab-primary:hover {
      background-color: #E7EBEE !important;
    }

    /* Compteur de fenêtres : pastille blanche lisible sur le gris */
    .mirador-workspace-control-panel .MuiBadge-badge {
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 9px;
      background-color: #ffffff !important;
      color: #37424D !important;
      font-family: 'Figtree', -apple-system, sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      box-shadow: 0 0 0 2px #37424D;
    }

    /* Bordure de la fenêtre active : même gris que la barre */
    .mirador-window-top-bar {
      border-top-color: #37424D !important;
    }

    /* -------------------------------------------------------
       Vignettes (thumbnail navigation)
    ------------------------------------------------------- */
    .mirador-thumb-navigation {
      background-color: #ffffff !important;
      border-top: 0.5px solid #E7EBEE !important;
    }

    .mirador77.mirador78 {
      outline-color: #2380D1 !important;
    }

    /* -------------------------------------------------------
       Scrollbar panneau
    ------------------------------------------------------- */
    .mirador-scrollto-scrollable::-webkit-scrollbar {
      width: 3px;
    }

    .mirador-scrollto-scrollable::-webkit-scrollbar-track {
      background: #E7EBEE;
    }

    .mirador-scrollto-scrollable::-webkit-scrollbar-thumb {
      background: #CCE2F3;
      border-radius: 4px;
    }

    .mirador-scrollto-scrollable::-webkit-scrollbar-thumb:hover {
      background: #2380D1;
    }


    /* -------------------------------------------------------
       Outils d'image : colonne verticale à gauche de l'image
       (grand écran ; sur petit écran, le plugin les empile déjà)
    ------------------------------------------------------- */
    @media (min-width: 960px) {
      .mirador-osd-container .MuiPaper-elevation4:has(> div > button[aria-label$="les outils"]),
      .mirador-osd-container .MuiPaper-elevation4:has(> div > button[aria-label$="image tools"]) {
        top: 8px !important;
        right: auto !important;
        left: 8px !important;
        flex-direction: column !important;
        align-items: center;
      }

      /* Bouton ouvrir / fermer en haut de la colonne */
      .mirador-osd-container .MuiPaper-elevation4:has(> div > button[aria-label$="les outils"]) > div:last-child,
      .mirador-osd-container .MuiPaper-elevation4:has(> div > button[aria-label$="image tools"]) > div:last-child {
        order: -1;
      }

      /* Groupes d'outils empilés, séparés par un trait */
      .mirador-osd-container .MuiPaper-elevation4:has(> div > button[aria-label$="les outils"]) > div:not(:last-child),
      .mirador-osd-container .MuiPaper-elevation4:has(> div > button[aria-label$="image tools"]) > div:not(:last-child) {
        flex-direction: column !important;
        border-right: 0 !important;
        border-image: none !important;
        border-top: 1px solid rgba(0, 0, 0, 0.12) !important;
      }

      /* Curseurs (luminosité, contraste…) à droite de leur bouton */
      .mirador-osd-container div:has(> .MuiPaper-elevation4[aria-labelledby]) {
        position: relative;
      }

      .mirador-osd-container div:has(> .MuiPaper-elevation4[aria-labelledby]) > .MuiPaper-elevation4[aria-labelledby] {
        top: 0 !important;
        left: calc(100% + 6px) !important;
        margin: 0 !important;
      }
    }

    /* -------------------------------------------------------
       Indicateur de chargement des pages (TileLoaderPlugin)
    ------------------------------------------------------- */
    .mirador-tile-loader {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .mirador-tile-loader.is-visible {
      opacity: 1;
    }

    .mirador-tile-loader__pastille {
      display: inline-flex;
      align-items: center;
      gap: 0.625rem;
      padding: 0.5rem 1rem 0.5rem 0.75rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 2px 12px rgba(11, 17, 58, 0.18);
      font-family: 'Figtree', -apple-system, sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      color: #0b113a;
    }

    .mirador-tile-loader__spinner {
      width: 1.125rem;
      height: 1.125rem;
      border: 2px solid #CCE2F3;
      border-top-color: #2380D1;
      border-radius: 50%;
      animation: mirador-spin 0.75s linear infinite;
    }

    @keyframes mirador-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes mirador-pulse {
      50% { opacity: 0.4; }
    }

    @media (prefers-reduced-motion: reduce) {
      .mirador-tile-loader {
        transition: none;
      }

      .mirador-tile-loader__spinner {
        animation: mirador-pulse 1.5s ease-in-out infinite;
      }
    }
  </style>
</head>
<body>
<div id="mirador"></div>
<script src="mirador.js"></script>
<script>
/* -------------------------------------------------------
   Reset zoom quand Mirador change réellement de taille
------------------------------------------------------- */
const miradorContainer = document.getElementById('mirador');

const resizeObserver = new ResizeObserver(() => {
  setTimeout(() => {
    const allResetBtns = document.querySelectorAll(
      'button[title="Reset zoom"], button[aria-label="Reset zoom"]'
    );
    allResetBtns.forEach(resetBtn => {
      if (resetBtn.offsetParent !== null) resetBtn.click();
    });
  }, 750);
});

resizeObserver.observe(miradorContainer);

</script>
<script>
/* -----------------------------------------------------------------------------
  NIMA - 2026-08-11 Add Guide Button after Fullscreen in Workspace Control Panel
-------------------------------------------------------------------------------- */
function addGuideButton() {
  // Find the workspace control panel button container
  const controlPanel = document.querySelector('.mirador-workspace-control-panel .mirador6');
  if (!controlPanel) {
    setTimeout(addGuideButton, 500);
    return;
  }

  // Check if button already exists
  if (document.getElementById('guideBtn')) return;

  // Find the div.mirador8 that contains the icon buttons
  const buttonContainer = controlPanel.querySelector('.mirador8');
  if (!buttonContainer) return;

  // Create the guide button
  const guideBtn = document.createElement('button');
  guideBtn.className = 'MuiButtonBase-root MuiIconButton-root';
  guideBtn.id = 'guideBtn';
  guideBtn.type = 'button';
  guideBtn.setAttribute('aria-label', 'Guide IIIF et Mirador');
  guideBtn.setAttribute('title', 'Guide IIIF et Mirador');
  guideBtn.tabIndex = 0;

  // Add the help icon SVG (same style as other buttons)
  guideBtn.innerHTML = '<span class="MuiIconButton-label"><svg class="MuiSvgIcon-root" focusable="false" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"></path></svg></span><span class="MuiTouchRipple-root"></span>';

  // Add click handler
  guideBtn.onclick = function() {
    window.open('/page/mirador-guide', '_blank');
  };

  // Find the fullscreen button and insert after it
  const fullscreenBtn = buttonContainer.querySelector('button[aria-label*="Plein écran"], button[aria-label*="Full screen"]');
  
  if (fullscreenBtn && fullscreenBtn.parentNode === buttonContainer) {
    // Insert after fullscreen button
    buttonContainer.insertBefore(guideBtn, fullscreenBtn.nextSibling);
  } else {
    // Fallback: add to end
    buttonContainer.appendChild(guideBtn);
  }
}

// Run after Mirador loads
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', addGuideButton);
} else {
  setTimeout(addGuideButton, 1000);
}
</script>
</body>
</html>
