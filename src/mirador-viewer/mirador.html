<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mirador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Lora:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <style>
    /* -------------------------------------------------------
       Réordonne les boutons de la barre de titre
    ------------------------------------------------------- */
    .mirador-window-top-bar button[aria-label="Full screen"] { order: 1; }
    .mirador-window-top-bar button[aria-label="Window views & thumbnail display"] { order: 2; }
    .mirador-window-top-bar button[aria-label="Window options"] { order: 3; }
    .mirador-window-top-bar .mirador-window-close { order: 4; }

    /* -------------------------------------------------------
       Fond du workspace
    ------------------------------------------------------- */
    .mirador1 {
      background: #ffffff !important;
    }

    /* -------------------------------------------------------
      Titre de la fenêtre — responsive
    ------------------------------------------------------- */
    .mirador-window-top-bar {
      display: flex !important;
      flex-wrap: nowrap !important;
      align-items: center !important;
      height: auto !important;
      min-height: 34px !important;
      gap: 0 !important;
      padding:3px;
    }

    /* Les boutons ne rétrécissent pas */
    .mirador-window-top-bar .MuiIconButton-root {
      flex-shrink: 0 !important;
    }

    .mirador-window-top-bar .MuiTypography-h2,
      .mirador-window header nav h2.MuiTypography-noWrap {
        font-family: 'Figtree', Georgia, serif !important;
        font-weight: 600 !important;
        color: #0b113a !important;
        font-size: 1.25rem !important;
        line-height: 1.25 !important;
        white-space: normal;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
        min-width: 0 !important;
        flex: 1 1 0 !important;
      }

      .mirador-osd-container .MuiFab-root {
          margin-top: 10px !important;
        }

        /* Force les boutons text overlay à ne plus se superposer */
        .mirador-osd-container > div {
          display: flex !important;
          flex-direction: column !important;
          align-items: flex-end !important;
          gap: 10px !important;

          position: absolute;
          right: 16px;
          bottom: 80px;
        }

      @media (max-width: 768px) {
        .mirador-window-top-bar .MuiTypography-h2, .mirador-window header nav h2.MuiTypography-noWrap {
          font-size: 1.15rem !important;
          white-space: nowrap !important;
        }

        button[aria-label*="text overlay"],
        button[aria-label*="OCR"] {
          display: none !important;
        }
      }

    /* -------------------------------------------------------
       Cacher la description du niveau manifest dans Mirador
    ------------------------------------------------------- */
    p.MuiTypography-root.MuiTypography-body1 span.mirador-third-party-html {
      display: none !important;
    }

    /* -------------------------------------------------------
       Panneau latéral — fond et bordure
    ------------------------------------------------------- */
    .mirador-companion-window-left {
      background-color: #ffffff !important;
      border-right: 1px solid #E7EBEE !important;
    }

    /* -------------------------------------------------------
       En-tête "About this item"
    ------------------------------------------------------- */
    .mirador-companion-window-header .MuiTypography-h3 {
      font-family: 'Figtree', -apple-system, sans-serif !important;
      font-size: 0.875rem !important;
      font-weight: 600 !important;
      letter-spacing: 0.10em !important;
      text-transform: uppercase !important;
      color: #607386 !important;
    }

    /* -------------------------------------------------------
       Titres de section : "Current item", "Resource", "Related"
    ------------------------------------------------------- */
    .mirador-window-sidebar-info-panel .MuiTypography-overline {
      font-family: 'Figtree', -apple-system, sans-serif !important;
      font-size: 0.625rem !important;
      font-weight: 600 !important;
      letter-spacing: 0.12em !important;
      text-transform: uppercase !important;
      color: #607386 !important;
    }

    /* -------------------------------------------------------
       Titre item courant et titre ressource
    ------------------------------------------------------- */
    .mirador-window-sidebar-info-panel .MuiTypography-h4 {
      font-family: 'Figtree', -apple-system, sans-serif !important;
      font-size: 1.125rem !important;
      font-weight: 600 !important;
      color: #0b113a !important;
      padding: 0.25rem 1rem 0.625rem !important;
      line-height: 1.4 !important;
    }

    /* -------------------------------------------------------
       Labels clés (dt)
    ------------------------------------------------------- */
    .mirador-window-sidebar-info-panel .mirador-label-value-metadata dt {
      font-family: 'Figtree', -apple-system, sans-serif !important;
      font-size: 0.85rem !important;
      font-weight: 600 !important;
      color: #607386 !important;
      letter-spacing: 0.06em !important;
      padding-top: 0.375rem !important;
      margin-top: 0.25rem !important;
      border-top: 0.5px solid #E7EBEE !important;
    }

    /* -------------------------------------------------------
       Valeurs (dd)
    ------------------------------------------------------- */
    .mirador-window-sidebar-info-panel .mirador-label-value-metadata dd {
      font-family: 'Figtree', -apple-system, sans-serif !important;
      font-size: 0.8125rem !important;
      font-weight: 500 !important;
      color: #252525 !important;
      line-height: 1.5 !important;
      margin-bottom: 0.25em !important;
      margin-left: 0 !important;
    }

    /* -------------------------------------------------------
       Liens dans les métadonnées
    ------------------------------------------------------- */
    .mirador-window-sidebar-info-panel .mirador-label-value-metadata a {
      font-family: 'Figtree', -apple-system, sans-serif !important;
      font-size: 0.8125rem !important;
      font-weight: 500 !important;
      color: #2380D1 !important;
      word-break: break-all !important;
      text-decoration: none !important;
    }

    .mirador-window-sidebar-info-panel .mirador-label-value-metadata a:hover {
      color: #0b113a !important;
      text-decoration: underline !important;
    }

    /* -------------------------------------------------------
       Compteur de pages et label canvas
    ------------------------------------------------------- */
    .mirador-canvas-count,
    .mirador-canvas-label {
      font-family: 'Figtree', -apple-system, sans-serif !important;
      font-size: 0.8125rem !important;
      font-weight: 500 !important;
      color: #607386 !important;
    }

    /* -------------------------------------------------------
       Onglets latéraux — indicateur actif
    ------------------------------------------------------- */
    .MuiTabs-indicator {
      background-color: #2380D1 !important;
    }

    .MuiTab-root.Mui-selected {
      color: #2380D1 !important;
      border-right-color: #2380D1 !important;
    }

    .MuiTab-root.Mui-selected .MuiSvgIcon-root {
      color: #2380D1 !important;
    }

    .MuiTab-root:not(.Mui-selected) .MuiSvgIcon-root {
      color: #607386 !important;
    }

    /* -------------------------------------------------------
       Panneau de navigation workspace (barre gauche)
    ------------------------------------------------------- */
    .mirador-workspace-control-panel {
      background-color: #222930 !important;
    }

    .mirador-workspace-control-panel .MuiIconButton-root .MuiSvgIcon-root {
      color: #CCE2F3 !important;
    }

    .mirador-workspace-control-panel .MuiIconButton-root:hover .MuiSvgIcon-root {
      color: #ffffff !important;
    }

    .mirador-workspace-control-panel .MuiFab-primary {
      background-color: #2380D1 !important;
    }

    .mirador-workspace-control-panel .MuiFab-primary:hover {
      background-color: #0c144d !important;
    }

    /* -------------------------------------------------------
       Vignettes (thumbnail navigation)
    ------------------------------------------------------- */
    .mirador-thumb-navigation {
      background-color: #ffffff !important;
      border-top: 0.5px solid #E7EBEE !important;
    }

    .mirador77.mirador78 {
      outline-color: #2380D1 !important;
    }

    /* -------------------------------------------------------
       Scrollbar panneau
    ------------------------------------------------------- */
    .mirador-scrollto-scrollable::-webkit-scrollbar {
      width: 3px;
    }

    .mirador-scrollto-scrollable::-webkit-scrollbar-track {
      background: #E7EBEE;
    }

    .mirador-scrollto-scrollable::-webkit-scrollbar-thumb {
      background: #CCE2F3;
      border-radius: 4px;
    }

    .mirador-scrollto-scrollable::-webkit-scrollbar-thumb:hover {
      background: #2380D1;
    }


    /* -------------------------------------------------------
       LOADER — animation de chargement des tuiles OSD
    ------------------------------------------------------- */
    .mirador-tile-loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.88);
      z-index: 100;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    .mirador-tile-loader.fade-out {
      opacity: 0;
    }

    .mirador-tile-loader.hidden {
      display: none;
    }

    .loader-spinner {
      width: 2.25rem;
      height: 2.25rem;
      border: 3px solid #CCE2F3;
      border-top-color: #2380D1;
      border-radius: 50%;
      animation: mirador-spin 0.75s linear infinite;
    }

    @keyframes mirador-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<div id="mirador"></div>
<script src="mirador.js"></script>
<script>
/* -------------------------------------------------------
   Deplacer le boutton du plugin textoverlay de Mirador
------------------------------------------------------- */
let applied = false;

function fixMiradorButtons() {
  if (applied) return;

  const btn = document.querySelector('button[aria-label*="text overlay"]');
  if (!btn) return;

  const parent = btn.closest('.MuiPaper-elevation4');
  if (!parent) return;

  parent.style.top = '125px';
  applied = true;
}

fixMiradorButtons();

const observer = new MutationObserver(fixMiradorButtons);

observer.observe(document.body, {
  childList: true,
  subtree: true
});
</script>
<script>
/* -------------------------------------------------------
   Reset zoom quand Mirador change réellement de taille
------------------------------------------------------- */
const miradorContainer = document.getElementById('mirador');

const resizeObserver = new ResizeObserver(() => {
  setTimeout(() => {
    const allResetBtns = document.querySelectorAll(
      'button[title="Reset zoom"], button[aria-label="Reset zoom"]'
    );
    allResetBtns.forEach(resetBtn => {
      if (resetBtn.offsetParent !== null) resetBtn.click();
    });
  }, 500);
});

resizeObserver.observe(miradorContainer);

  /* -------------------------------------------------------
     Loader OSD
  ------------------------------------------------------- */
  function createLoader() {
    const el = document.createElement('div');
    el.className = 'mirador-tile-loader hidden';
    el.innerHTML = '<div class="loader-spinner"></div>';
    return el;
  }

  function showLoader(loader) {
    loader.classList.remove('hidden', 'fade-out');
    loader.style.opacity = '1';
  }

  function hideLoader(loader) {
    loader.classList.add('fade-out');
    setTimeout(() => {
      loader.classList.add('hidden');
      loader.classList.remove('fade-out');
    }, 500);
  }

  /* Lit tous les canvas OSD — OSD en utilise deux superposés,
     on vérifie le premier canvas non masqué qui a du contenu */
  function isCanvasLoaded(osdContainer) {
      const canvases = osdContainer.querySelectorAll('canvas');

      for (const canvas of canvases) {
        if (canvas.style.visibility === 'hidden') continue;
        if (canvas.width === 0 || canvas.height === 0) continue;

        try {
          const ctx = canvas.getContext('2d');

          const points = [
            [0.25, 0.25],
            [0.5, 0.5],
            [0.75, 0.75],
            [0.25, 0.75],
            [0.75, 0.25]
          ];

          let visiblePixels = 0;

          for (const [px, py] of points) {
            const x = Math.floor(canvas.width * px);
            const y = Math.floor(canvas.height * py);
            const pixel = ctx.getImageData(x, y, 1, 1).data;

            if (pixel[3] > 0) visiblePixels++;
          }

          // seuil minimum (ex: 3/5 points visibles)
          if (visiblePixels >= 3) return true;

        } catch (e) {
          return true;
        }
      }

      return false;
    }

  function waitForCanvas(osdContainer, loader) {
    // Sécurité : cache le loader après 30s max
    const maxWait = setTimeout(() => hideLoader(loader), 30000);

    function check() {
      if (loader.classList.contains('hidden')) {
        clearTimeout(maxWait);
        return;
      }
      if (isCanvasLoaded(osdContainer)) {
        clearTimeout(maxWait);
        hideLoader(loader);
      } else {
        requestAnimationFrame(check);
      }
    }
    requestAnimationFrame(check);
  }

  function triggerLoader(osdSection, loader) {
    const osdContainer = osdSection.querySelector('.openseadragon-container');
    if (!osdContainer) return;

    // N'affiche le loader que si l'image n'est pas déjà prête
    if (isCanvasLoaded(osdContainer)) return;

    showLoader(loader);
    waitForCanvas(osdContainer, loader);
  }

  function attachLoader(osdSection) {

  if (osdSection.querySelector('.mirador-tile-loader')) return;

  const loader = createLoader();
  osdSection.appendChild(loader);

  const osdContainer = osdSection.querySelector('.openseadragon-container');
  if (!osdContainer) return;

  function startLoadingCheck() {
    showLoader(loader);

    // attend que le canvas contienne réellement l'image
    waitForCanvas(osdContainer, loader);
  }

  /* navigation Mirador */
  document.addEventListener('click', (e) => {

    const btn = e.target.closest(
      '.mirador-next-canvas-button, .mirador-previous-canvas-button'
    );

    if (btn && osdSection.closest('.mirador-window')?.contains(btn)) {
      setTimeout(startLoadingCheck, 100);
    }

    const thumb = e.target.closest('.mirador-thumbnail-nav-canvas');

    if (thumb) {
      setTimeout(startLoadingCheck, 100);
    }

  });

  /* changement de page détecté par Mirador */
  new MutationObserver(() => {
    startLoadingCheck();
  }).observe(osdSection, {
    attributes: true,
    attributeFilter: ['aria-label']
  });

  /* premier chargement */
  startLoadingCheck();
}

  function watchForOSD() {
    const rootObserver = new MutationObserver(() => {
      document.querySelectorAll('.mirador-osd-container')
        .forEach(attachLoader);
    });
    rootObserver.observe(document.getElementById('mirador'), {
      childList: true,
      subtree: true
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', watchForOSD);
  } else {
    watchForOSD();
  }
</script>
</body>
</html>
