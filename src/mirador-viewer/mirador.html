<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mirador</title>
  <style>
    /* Réordonne les boutons de droite */
    .mirador-window-top-bar button[aria-label="Plein écran"] {
      order: 1;
    }
    .mirador-window-top-bar button[aria-label="Options de fenêtre"] {
      order: 2;
    }
    .mirador-window-top-bar button[aria-label="Autres options et outils"] {
      order: 3;
    }
    .mirador-window-top-bar .mirador-window-close {
      order: 4;
    }
	/* Cacher le description du niveau manifest dans Mirador */
	p.MuiTypography-root.MuiTypography-body1 span.mirador-third-party-html {
      display: none !important;
    }
	/* ── Panneau de métadonnées : base commune ── */
	.mirador-companion-area-left .mirador-companion-windows dl,
	.mirador-companion-area-left .mirador-companion-windows dt,
	.mirador-companion-area-left .mirador-companion-windows dd {
	  -webkit-text-size-adjust: 100%;
	  -webkit-font-smoothing: antialiased;
	  font-family: Lato, Helvetica, Arial, sans-serif;
	  color: rgba(0, 0, 0, 0.87);
	  word-break: break-word;
	  box-sizing: border-box;
	  border: 0 solid #e2e8f0;
	  margin: 0;
	  user-select: auto;
	  cursor: auto;
	  scroll-margin-top: 12rem;
	  --transition-duration: 250ms;
	}
	/* ── dl ── */
	.mirador-companion-area-left .mirador-companion-windows dl {
	  font-size: 1rem;
	  line-height: 2;
	}
	/* ── dt (libellés) ── */
	.mirador-companion-area-left .mirador-companion-windows dt {
	  font-size: 0.95rem;
	  font-weight: 700;
	  letter-spacing: 0.02em;
	  line-height: 1.375;
	  margin-top: 0.5rem;
	  color: #006780;
	}
	/* ── dd (valeurs) ── */
	.mirador-companion-area-left .mirador-companion-windows dd {
	  font-size: 0.95rem;
	  font-weight: 400;
	  line-height: 1.6em;
	  letter-spacing: 0em;
	  color: rgba(116, 116, 116, 1);
	  padding-bottom: 0.5rem;
	  margin-bottom: 0.5em;
	  border-bottom: 1px solid rgba(232, 232, 232, 1);
	}
	/* ── dd: Supprimer la bordure du dernier élément ── */
	.mirador-companion-area-left .mirador-companion-windows dd:last-child {
	  border-bottom: none;
	  padding-bottom: 0;
	}
  </style>
</head>
<body>
<div id="mirador"></div>
<script src="mirador.js"></script>
<script>
  // Détecte le changement de taille de la fenêtre (déclenché quand l'iframe
  // passe en plein écran dans DSpace) et réinitialise le zoom OSD.
  window.addEventListener('resize', () => {
    setTimeout(() => {
      const allResetBtns = document.querySelectorAll(
        'button[title="Réinitialiser le zoom"], button[aria-label="Réinitialiser le zoom"]'
      );
      allResetBtns.forEach(resetBtn => {
        if (resetBtn.offsetParent !== null) {
          resetBtn.click();
          //console.log('Reset zoom via resize');
        }
      });
    }, 300);
  });
</script>
</body>
</html>
